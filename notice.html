<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিশেষ নোটিশ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .notice-card {
            background-color: #ffffff;
            border-left: 8px solid #ff4d4d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            text-align: center;
        }
        .notice-title {
            color: #ff4d4d;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .notice-body {
            color: #333333;
            font-size: 18px;
            line-height: 1.6;
        }
        .highlight {
            color: #d93838;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="notice-card">
        <div class="notice-title">⚠️ বিশেষ নোটিশ</div>
        <div class="notice-body">
            আগামীকাল <span class="highlight">রোজ শনিবার</span> প্রাইভেট বন্ধ থাকবে। 
        </div>
    </div>

</body>
</html>
